name: dependency review

# Gates what a pull request adds: a dependency under a licence the collection
# cannot ship under (the collection is GPL-3.0-or-later), or a known-vulnerable
# version.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          deny-licenses: GPL-2.0-only, BUSL-1.1
          fail-on-severity: low
          comment-summary-in-pr: on-failure
