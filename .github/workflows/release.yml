name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Tag matches the collection version
        run: |
          version=$(awk '/^version:/ {print $2}' galaxy.yml)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Tagged commit has a green test run
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag pushed right after a merge arrives before the commit's ci run has finished; wait for it.
        run: |
          for i in $(seq 1 60); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}" --jq '[.workflow_runs[] | select(.name == "ci")]')
            if [ "$(jq 'map(select(.conclusion == "success")) | length' <<< "$runs")" -ge 1 ]; then exit 0; fi
            if [ "$(jq 'length' <<< "$runs")" -ge 1 ] && [ "$(jq 'map(select(.status != "completed")) | length' <<< "$runs")" -eq 0 ]; then
              echo "the ci run for ${GITHUB_SHA} did not succeed"; exit 1
            fi
            echo "waiting for the ci run of ${GITHUB_SHA}"; sleep 30
          done
          echo "no successful ci run for ${GITHUB_SHA} after 30 minutes"; exit 1
      - name: Build
        run: |
          python -m pip install ansible-core
          ansible-galaxy collection build
      - name: Publish to Ansible Galaxy
        env:
          ANSIBLE_GALAXY_API_KEY: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
        run: ansible-galaxy collection publish --api-key "$ANSIBLE_GALAXY_API_KEY" benemon-nomad-*.tar.gz
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" benemon-nomad-*.tar.gz --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
