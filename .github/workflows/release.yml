name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Tag matches the collection version
        run: |
          version=$(awk '/^version:/ {print $2}' galaxy.yml)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Tagged commit has a green test run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&status=success" --jq '[.workflow_runs[] | select(.name == "ci")] | length')
          test "${n}" -ge 1 || { echo "no successful test run for ${GITHUB_SHA}"; exit 1; }
      - name: Build
        run: |
          python -m pip install ansible-core
          ansible-galaxy collection build
      - name: Publish to Ansible Galaxy
        env:
          ANSIBLE_GALAXY_API_KEY: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
        run: ansible-galaxy collection publish --api-key "$ANSIBLE_GALAXY_API_KEY" benemon-nomad-*.tar.gz
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" benemon-nomad-*.tar.gz --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
