name: test

on:
  push:
    branches: ["**"]
  pull_request:

env:
  NOMAD_VERSION: "2.0.5"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The oldest ansible-core the collection claims on its oldest Python, and the newest of both.
      matrix:
        include:
          - ansible-core: "2.19.*"
            python-version: "3.11"
          - ansible-core: "2.21.*"
            python-version: "3.13"
    env:
      NOMAD_LICENSE: ${{ secrets.NOMAD_LICENCE }}
    defaults:
      run:
        working-directory: ansible_collections/benemon/nomad
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/benemon/nomad
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Nomad Community and Enterprise
        run: |
          set -euo pipefail
          for edition in "" "+ent"; do
            v="${NOMAD_VERSION}${edition}"
            z="nomad_${v}_linux_amd64.zip"
            curl -sfLO "https://releases.hashicorp.com/nomad/${v}/${z}"
            curl -sfLO "https://releases.hashicorp.com/nomad/${v}/nomad_${v}_SHA256SUMS"
            grep "${z}" "nomad_${v}_SHA256SUMS" | sha256sum -c -
            mkdir -p "$HOME/nomad${edition}"
            unzip -oq "${z}" nomad -d "$HOME/nomad${edition}"
            rm -f "${z}" "nomad_${v}_SHA256SUMS"
          done
          echo "NOMADPY_TEST_CE_BIN=$HOME/nomad/nomad" >> "$GITHUB_ENV"
          echo "NOMADPY_TEST_ENT_BIN=$HOME/nomad+ent/nomad" >> "$GITHUB_ENV"
      - name: Write the Enterprise licence
        if: ${{ env.NOMAD_LICENSE != '' }}
        run: |
          umask 077
          printf '%s\n' "$NOMAD_LICENSE" > "$HOME/nomad.hclic"
          echo "NOMAD_LICENSE_PATH=$HOME/nomad.hclic" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install "ansible-core==${{ matrix.ansible-core }}" -r requirements.txt
      - name: Sanity
        run: ansible-test sanity --python ${{ matrix.python-version }} --requirements
      - name: Units
        run: ansible-test units --python ${{ matrix.python-version }} --requirements
      - name: Integration
        run: python tests/integration/run.py --python ${{ matrix.python-version }}
