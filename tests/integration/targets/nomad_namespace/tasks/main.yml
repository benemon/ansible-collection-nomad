- name: Connection from the lane
  module_defaults:
    group/benemon.nomad.nomad:
      address: "{{ nomad_address }}"
      token: "{{ nomad_token }}"
  block:
    - name: Create a namespace
      benemon.nomad.nomad_namespace:
        name: web
        description: Web tier
        capabilities:
          enabled_task_drivers: [raw_exec]
      register: created

    - name: Create it again with the same options
      benemon.nomad.nomad_namespace:
        name: web
        description: Web tier
        capabilities:
          enabled_task_drivers: [raw_exec]
      register: again

    - name: Update only the description, in check mode
      benemon.nomad.nomad_namespace:
        name: web
        description: Front door
      check_mode: true
      diff: true
      register: checked

    - name: Read it back
      benemon.nomad.nomad_namespace_info:
        name: web
      register: info

    - ansible.builtin.assert:
        that:
          - created is changed
          - created.namespace.Capabilities.EnabledTaskDrivers == ['raw_exec']
          - again is not changed
          - checked is changed
          - checked.diff.before.Description == 'Web tier'
          - checked.diff.after.Description == 'Front door'
          - info.namespaces | length == 1
          - info.namespaces[0].Description == 'Web tier'
          - info.namespaces[0].Capabilities.EnabledTaskDrivers == ['raw_exec']

    - name: Apply a quota (Enterprise)
      benemon.nomad.nomad_namespace:
        name: web
        quota: missing-quota
      register: quota
      ignore_errors: true

    - name: A quota that does not exist fails with the server's status
      ansible.builtin.assert:
        that:
          - quota is failed
          - quota.status_code is defined

    - name: Enterprise fields on the Enterprise lane
      when: nomad_enterprise
      block:
        - name: Create a quota
          benemon.nomad.nomad_quota:
            name: web-quota
            limits:
              - region: global
                region_limit:
                  cpu: 1000
                  memory_mb: 1024

        - name: Apply the quota and a node pool configuration
          benemon.nomad.nomad_namespace:
            name: web
            quota: web-quota
            node_pool_configuration:
              default: default
          register: ent

        - name: Apply them again
          benemon.nomad.nomad_namespace:
            name: web
            quota: web-quota
            node_pool_configuration:
              default: default
          register: ent_again

        - name: Detach the quota, which the server requires before the namespace can be deleted
          benemon.nomad.nomad_namespace:
            name: web
            quota: ""
          register: detached

        - ansible.builtin.assert:
            that:
              - ent is changed
              - ent.namespace.Quota == 'web-quota'
              - ent.namespace.NodePoolConfiguration.Default == 'default'
              - ent_again is not changed
              - detached is changed
              - detached.namespace.Quota == ''

    - name: Delete the namespace
      benemon.nomad.nomad_namespace:
        name: web
        state: absent
      register: deleted

    - name: Delete it again
      benemon.nomad.nomad_namespace:
        name: web
        state: absent
      register: deleted_again

    - name: Delete the quota
      benemon.nomad.nomad_quota:
        name: web-quota
        state: absent
      when: nomad_enterprise

    - ansible.builtin.assert:
        that:
          - deleted is changed
          - deleted_again is not changed

- name: Connection options fall back to the environment the Nomad CLI reads
  benemon.nomad.nomad_namespace_info:
    name: default
  environment:
    NOMAD_ADDR: "{{ nomad_address }}"
    NOMAD_TOKEN: "{{ nomad_token }}"
  register: from_env

- name: The token is required on this agent, so a result proves the fallback was used
  ansible.builtin.assert:
    that:
      - from_env.namespaces[0].Name == 'default'
