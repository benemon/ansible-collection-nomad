- name: Inventory from the lane
  module_defaults:
    group/benemon.nomad.nomad:
      address: "{{ nomad_address }}"
      token: "{{ nomad_token }}"
  vars:
    # ansible-inventory runs as a separate process, so the collection is found through the path ansible-test exports.
    collections_path: "{{ lookup('ansible.builtin.env', 'ANSIBLE_COLLECTIONS_PATH') }}"
    connection:
      plugin: benemon.nomad.nomad
      address: "{{ nomad_address }}"
      token: "{{ nomad_token }}"
    configs:
      base:
        servers: true
        allocations: true
      services:
        clients: false
        allocations: true
        services: true
        compose:
          ansible_host: (nomad_services | selectattr('ServiceName', 'eq', 'inv-ssh') | first).Address
          ansible_port: (nomad_services | selectattr('ServiceName', 'eq', 'inv-ssh') | first).Port
      ports:
        clients: false
        allocations: true
        compose:
          ansible_host: (nomad_allocation.AllocatedResources.Shared.Ports | selectattr('Label', 'eq', 'ssh') | first).HostIP
          ansible_port: (nomad_allocation.AllocatedResources.Shared.Ports | selectattr('Label', 'eq', 'ssh') | first).Value
      detail:
        node_detail: true
        keyed_groups:
          - key: nomad_node.Datacenter
            prefix: dc
        compose:
          nomad_version: nomad_node.Attributes['nomad.version']
  block:
    - name: Register a job with a labelled port and a service on it
      benemon.nomad.nomad_job:
        jobspec: |
          job "inv" {
            datacenters = ["dc1"]
            type        = "service"
            group "g" {
              count = 1
              network {
                port "ssh" {}
              }
              service {
                name     = "inv-ssh"
                port     = "ssh"
                provider = "nomad"
              }
              update {
                min_healthy_time = "1s"
                healthy_deadline = "30s"
              }
              task "t" {
                driver = "raw_exec"
                config {
                  command = "/bin/sh"
                  args    = ["-c", "sleep 600"]
                }
                resources {
                  cpu    = 10
                  memory = 32
                }
              }
            }
          }

    - name: The dev agent's client node
      benemon.nomad.nomad_node_info:
      register: nodes

    - name: A directory for the inventory files
      ansible.builtin.tempfile:
        state: directory
      register: workdir

    - name: Write the inventory files
      ansible.builtin.copy:
        content: "{{ connection | combine(item.value) | to_nice_yaml }}"
        dest: "{{ workdir.path }}/{{ item.key }}.nomad.yml"
        mode: "0600"
      loop: "{{ configs | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Read each inventory
      ansible.builtin.command:
        cmd: ansible-inventory -i {{ workdir.path }}/{{ item }}.nomad.yml --list
      environment:
        ANSIBLE_COLLECTIONS_PATH: "{{ collections_path }}"
      loop: "{{ configs.keys() | list }}"
      register: listed
      changed_when: false

    - name: Parse them
      ansible.builtin.set_fact:
        inventories: "{{ dict(configs.keys() | zip(listed.results | map(attribute='stdout') | map('from_json', profile='inventory_legacy'))) }}"
        node_name: "{{ nodes.nodes[0].Name }}"
        node_address: "{{ nodes.nodes[0].Address }}"

    - name: The client node is a host in its groups
      ansible.builtin.assert:
        that:
          - inventories.base.nomad_clients.hosts == [node_name]
          - inventories.base.nomad_datacenter_dc1.hosts is contains(node_name)
          - inventories.base.nomad_driver_raw_exec.hosts == [node_name]
          - inventories.base.nomad_status_ready.hosts == [node_name]
          - inventories.base.nomad_eligibility_eligible.hosts == [node_name]
          - inventories.base._meta.hostvars[node_name].ansible_host == node_address
          - inventories.base._meta.hostvars[node_name].nomad_node.ID == nodes.nodes[0].ID
          - "'Meta' not in inventories.base._meta.hostvars[node_name].nomad_node"

    - name: The server member is a host
      ansible.builtin.assert:
        that:
          - inventories.base.nomad_servers.hosts | length == 1
          - inventories.base._meta.hostvars[inventories.base.nomad_servers.hosts[0]].ansible_host is string
          - inventories.base._meta.hostvars[inventories.base.nomad_servers.hosts[0]].nomad_member.Tags.role == 'nomad'

    - name: The allocation is a host carrying its document and the exec variables, with no address chosen
      ansible.builtin.assert:
        that:
          - inventories.base.nomad_allocations.hosts == ['default.inv.g.0']
          - inventories.base.nomad_job_inv.hosts == ['default.inv.g.0']
          - inventories.base.nomad_namespace_default.hosts == ['default.inv.g.0']
          - "'ansible_host' not in alloc"
          - alloc.ansible_nomad_alloc_id == alloc.nomad_allocation.ID
          - alloc.ansible_nomad_namespace == 'default'
          - alloc.nomad_allocation.JobID == 'inv'
          - alloc.nomad_allocation.NodeName == node_name
          - (alloc.nomad_allocation.AllocatedResources.Shared.Ports | selectattr('Label', 'eq', 'ssh') | first).Value > 0
      vars:
        alloc: "{{ inventories.base._meta.hostvars['default.inv.g.0'] }}"

    - name: Composing the address from the host-mapped port
      ansible.builtin.assert:
        that:
          - alloc.ansible_host is string
          - alloc.ansible_port is integer
          - alloc.ansible_port == (alloc.nomad_allocation.AllocatedResources.Shared.Ports | selectattr('Label', 'eq', 'ssh') | first).Value
      vars:
        alloc: "{{ inventories.ports._meta.hostvars['default.inv.g.0'] }}"

    - name: The service registrations are on the host and compose the address
      ansible.builtin.assert:
        that:
          - alloc.nomad_services | length == 1
          - alloc.nomad_services[0].ServiceName == 'inv-ssh'
          - alloc.nomad_services[0].AllocID == alloc.ansible_nomad_alloc_id
          - alloc.ansible_host == alloc.nomad_services[0].Address
          - alloc.ansible_port == alloc.nomad_services[0].Port
      vars:
        alloc: "{{ inventories.services._meta.hostvars['default.inv.g.0'] }}"

    - name: Node detail and the constructed options
      ansible.builtin.assert:
        that:
          - inventories.detail._meta.hostvars[node_name].nomad_node.Attributes is mapping
          - inventories.detail._meta.hostvars[node_name].nomad_version == nodes.nodes[0].Version
          - inventories.detail.dc_dc1.hosts == [node_name]
  always:
    - name: Stop and purge the job
      benemon.nomad.nomad_job:
        name: inv
        state: absent
        purge: true

    - name: Remove the inventory files
      ansible.builtin.file:
        path: "{{ workdir.path }}"
        state: absent
      when: workdir.path is defined
