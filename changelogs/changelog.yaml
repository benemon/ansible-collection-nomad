ancestor: null
releases:
  0.1.0:
    changes:
      minor_changes:
      - Added end-to-end example playbooks under ``examples/`` and an Examples guide
        page that walks them.
      release_summary: 'First release of the ``benemon.nomad`` collection: modules
        and ``_info`` twins for jobs, namespaces, node pools,

        nodes, variables, ACL policies, roles and tokens, quotas and Sentinel policies,
        and a lookup for variables,

        all over the Nomad HTTP API through nomadpy.

        '
    fragments:
    - 0.1.0.yml
    - examples.yml
    modules:
    - description: Manage a Nomad ACL policy.
      name: nomad_acl_policy
      namespace: ''
    - description: Read Nomad ACL policies.
      name: nomad_acl_policy_info
      namespace: ''
    - description: Manage a Nomad ACL role.
      name: nomad_acl_role
      namespace: ''
    - description: Read Nomad ACL roles.
      name: nomad_acl_role_info
      namespace: ''
    - description: Manage a Nomad ACL token.
      name: nomad_acl_token
      namespace: ''
    - description: Read Nomad ACL tokens.
      name: nomad_acl_token_info
      namespace: ''
    - description: Register or stop a Nomad job.
      name: nomad_job
      namespace: ''
    - description: Read Nomad jobs.
      name: nomad_job_info
      namespace: ''
    - description: Manage a Nomad namespace.
      name: nomad_namespace
      namespace: ''
    - description: Read Nomad namespaces.
      name: nomad_namespace_info
      namespace: ''
    - description: Set the scheduling eligibility or drain of a Nomad node.
      name: nomad_node
      namespace: ''
    - description: Read Nomad client nodes.
      name: nomad_node_info
      namespace: ''
    - description: Manage a Nomad node pool.
      name: nomad_node_pool
      namespace: ''
    - description: Read Nomad node pools.
      name: nomad_node_pool_info
      namespace: ''
    - description: Manage a Nomad quota specification.
      name: nomad_quota
      namespace: ''
    - description: Read Nomad quota specifications.
      name: nomad_quota_info
      namespace: ''
    - description: Manage a Nomad Sentinel policy.
      name: nomad_sentinel_policy
      namespace: ''
    - description: Read Nomad Sentinel policies.
      name: nomad_sentinel_policy_info
      namespace: ''
    - description: Manage a Nomad variable.
      name: nomad_variable
      namespace: ''
    - description: Read Nomad variables.
      name: nomad_variable_info
      namespace: ''
    plugins:
      lookup:
      - description: Read a Nomad variable.
        name: nomad_variable
        namespace: null
    release_date: '2026-10-14'
  0.2.0:
    changes:
      minor_changes:
      - The collection requires nomadpy 0.2.0 or newer with its ``exec`` extra, which
        installs the ``websockets`` package the connection plugin uses, and Python
        3.11 or newer.
      release_summary: 'Inventory, exec and allocation control: the ``nomad`` inventory
        plugin lists client nodes, server members and

        running allocations with every address the API attaches to them; the ``nomad_exec``
        connection plugin runs tasks

        inside an allocation''s task over the exec API; ``nomad_allocation`` and ``nomad_allocation_info``
        restart, signal,

        stop and read allocations and their task logs. Requires nomadpy 0.2.0 with
        its ``exec`` extra and Python 3.11.

        '
    fragments:
    - 0.2.0.yml
    - requirements.yml
    modules:
    - description: Restart, signal or stop a Nomad allocation.
      name: nomad_allocation
      namespace: ''
    - description: Read Nomad allocations and their task logs.
      name: nomad_allocation_info
      namespace: ''
    plugins:
      connection:
      - description: Run tasks inside a task of a Nomad allocation.
        name: nomad_exec
        namespace: null
      inventory:
      - description: Nomad client nodes, server members and allocations as hosts.
        name: nomad
        namespace: null
    release_date: '2026-10-15'
  0.3.0:
    changes:
      breaking_changes:
      - nomad_exec connection - the exec timeout variable ``ansible_nomad_timeout``
        is renamed ``ansible_nomad_exec_timeout``, matching the option name ``exec_timeout``.
      bugfixes:
      - nomad_exec connection - with no timeout set, a wait for the exec connection
        or for output was documented as having no bound but stopped after the connection
        timeout keyword's 10 seconds, so a command silent for longer failed (https://github.com/benemon/ansible-collection-nomad/issues/18).
      known_issues:
      - nomad_exec connection - modules do not run in tasks on the podman driver,
        whose exec sessions never deliver the end of stdin; only ``ansible.builtin.raw``
        works there (https://github.com/benemon/ansible-collection-nomad/issues/17).
      release_summary: 'Exec fixes: the ``nomad_exec`` connection no longer bounds
        an unset exec timeout at the connection

        timeout keyword''s 10 seconds; its timeout variable is renamed ``ansible_nomad_exec_timeout``,
        which is a

        breaking change. The exec guide records that modules do not run in tasks on
        the podman driver.

        '
    fragments:
    - nomad-exec-podman-stdin.yml
    - nomad-exec-timeout.yml
    - release-summary.yml
    release_date: '2026-10-16'
  0.3.1:
    changes:
      bugfixes:
      - nomad_job - registering a periodic or parameterized job with O(wait=true)
        no longer fails looking up an evaluation that does not exist (https://github.com/benemon/ansible-collection-nomad/issues/28).
      release_summary: 'Bugfix release: ``nomad_job`` no longer fails waiting on an
        evaluation when it registers a periodic or parameterized

        job, which creates none.

        '
    fragments:
    - compat-workflow.yml
    - dependabot-nomadpy.yml
    - nomad_job-parameterized-wait.yml
    - release-summary.yml
    release_date: '2026-10-19'
