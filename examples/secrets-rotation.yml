- name: Rotate a database password held in a Nomad variable
  hosts: localhost
  gather_facts: false
  vars:
    prefix: example
  module_defaults:
    group/benemon.nomad.nomad:
      address: "{{ nomad_address | default(omit) }}"
      token: "{{ nomad_token | default(omit) }}"
  tasks:
    - name: Write a new password to the variable
      benemon.nomad.nomad_variable:
        path: "{{ prefix }}/db/credentials"
        items:
          username: app
          password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"

    - name: Create the file the application reads
      ansible.builtin.tempfile:
        suffix: .env
      register: env_file

    - name: Render the credentials into it through the lookup
      ansible.builtin.template:
        src: templates/app.env.j2
        dest: "{{ env_file.path }}"
        mode: "0600"

    - name: Remove everything the play created
      tags: [cleanup]
      block:
        - name: Delete the file
          ansible.builtin.file:
            path: "{{ env_file.path }}"
            state: absent

        - name: Delete the variable
          benemon.nomad.nomad_variable:
            path: "{{ prefix }}/db/credentials"
            state: absent
